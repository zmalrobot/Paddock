name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Windows Packaging Script
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Version "${{ inputs.version }}" -Configuration "Release"

      - name: Upload Windows Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paddock-${{ inputs.version }}-windows-x64
          path: artifacts/Paddock-*-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ensure packaging script is executable
        run: chmod +x ./scripts/build-linux.sh

      - name: Run Linux Packaging Script
        run: |
          ./scripts/build-linux.sh "${{ inputs.version }}" "Release"

      - name: Upload Linux Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paddock-${{ inputs.version }}-linux-x64
          path: artifacts/Paddock-*-linux-x64.zip
          if-no-files-found: error

