name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione di rilascio (es. 0.5.7 o v0.5.7)'
        required: false
        default: '0.5.7'
        type: string
      prerelease:
        description: 'Contrassegna come pre-release'
        required: false
        default: true
        type: boolean
      draft:
        description: 'Crea come bozza (draft)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  meta:
    name: Risoluzione Versione & Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Calcola stringa versione e tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            [ -z "$RAW" ] && RAW="0.5.7"
          else
            RAW="${{ github.ref_name }}"
          fi
          VERSION="${RAW#[vV]}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Versione risolta: ${VERSION}"
          echo "Tag risolto: ${TAG}"

  build-windows:
    name: Build Windows (win-x64)
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Windows Packaging Script
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Version "${{ needs.meta.outputs.version }}" -Configuration "Release"

      - name: Upload Windows Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paddock-${{ needs.meta.outputs.version }}-windows-x64
          path: artifacts/Paddock-*-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (linux-x64)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ensure packaging script is executable
        run: chmod +x ./scripts/build-linux.sh

      - name: Run Linux Packaging Script
        run: |
          ./scripts/build-linux.sh "${{ needs.meta.outputs.version }}" "Release"

      - name: Upload Linux Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paddock-${{ needs.meta.outputs.version }}-linux-x64
          path: artifacts/Paddock-*-linux-x64.zip
          if-no-files-found: error

  publish-release:
    name: Pubblica Ufficialmente su GitHub Releases
    needs: [meta, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tutti i pacchetti compilati
        uses: actions/download-artifact@v4
        with:
          path: release-packages
          merge-multiple: true

      - name: Verifica pacchetti scaricati
        run: |
          ls -la release-packages/

      - name: Crea o Aggiorna GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "Paddock ${{ needs.meta.outputs.tag }} (Pre-release)"
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || startsWith(needs.meta.outputs.version, '0.') || true }}
          generate_release_notes: true
          files: |
            release-packages/*.zip
          body: |
            ## Paddock ${{ needs.meta.outputs.tag }} (Pre-release)

            Paddock è l'applicazione desktop professionale per l'ingestione, organizzazione e vendita di foto di eventi sportivi, sviluppata in **.NET 10** e **Avalonia UI**.

            ### Pacchetti Disponibili per il Download
            - **Windows (x64)**: `Paddock-${{ needs.meta.outputs.version }}-windows-x64.zip`
              *(Self-contained, non richiede l'installazione di .NET. Estrarre ed avviare `Paddock.UI.exe`)*
            - **Linux (x64)**: `Paddock-${{ needs.meta.outputs.version }}-linux-x64.zip`
              *(Self-contained per distribuzioni Linux x86_64. Estrarre ed eseguire `./Paddock.UI`)*

            ### Novità e Funzionalità della Versione 0.5.7
            - **Compilazione Zero-Warning & NuGetAudit Resolution**: Risoluzione definitiva dei warning di sicurezza `NU1903` attraverso l'aggiornamento a `SixLabors.ImageSharp 3.1.12` e `SixLabors.ImageSharp.Drawing 2.1.7` e la configurazione mirata di `<NuGetAuditSuppress>` in `Directory.Build.props`, preservando l'audit attivo per tutte le altre librerie.
            - **Struttura Cartelle Portatile & Risoluzione Percorsi (Relativi ed Assoluti)**: Supporto nativo per la struttura a cartella radice singola (`<Cartella Base>/` contenente `Database/`, `Paddock/` e `Foto/`). Percorsi relativi predefiniti (`..\Database\Paddock_Database.xlsx` e `..\Foto`) con risoluzione deterministica e supporto trasparente e incondizionato per qualsiasi percorso assoluto o su disco esterno. Feedback visivo dinamico nella UI per il percorso effettivo su disco e selettori con calcolo automatico del percorso relativo.
            - **Watermark e Metadati Singola Foto**: Nuovo pulsante dedicato nel visore ingrandito a schermo intero (darkroom) per applicare filigrana visiva e metadati (fotografo, copyright) su singoli file JPG/PNG, con salvataggio atomico con sostituzione del file, invalidazione cache miniature e aggiornamento in tempo reale del foglio Excel.
            - **Icona Win32 PE Incorporata**: Generazione ed incorporamento dell'icona multi-risoluzione `logo.ico` (da 16x16 a 256x256 HiDPI) direttamente all'interno degli eseguibili Windows `Paddock.UI.exe` e `Paddock.Updater.exe`.
            - **Packaging Linux Desktop**: Creazione e distribuzione del file desktop FreeDesktop `paddock.desktop` e automazione dello script di packaging Linux multipiattaforma.
            - **Riorganizzazione Tab Informazioni nelle Impostazioni**: Layout a blocchi pulito e gerarchico (Paddock Organizer -> Aggiornamenti software -> Versioni componenti -> Link GitHub -> Copyright/Autore).
            - **Funzionalità Ereditate**: Sistema di aggiornamento automatico (`Paddock.Updater`), supporto foto RAW / Canon CR2, rotazione automatica lossless in ingestione, browser a due tab con Premiazioni, ridenominazione metadati da SD, slideshow multi-monitor con 10 effetti e catalogo prezzi vendita.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
