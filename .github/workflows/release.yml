name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione di rilascio (es. 0.5.5 o v0.5.5)'
        required: false
        default: '0.5.5'
        type: string
      prerelease:
        description: 'Contrassegna come pre-release'
        required: false
        default: true
        type: boolean
      draft:
        description: 'Crea come bozza (draft)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  meta:
    name: Risoluzione Versione & Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Calcola stringa versione e tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            [ -z "$RAW" ] && RAW="0.5.5"
          else
            RAW="${{ github.ref_name }}"
          fi
          VERSION="${RAW#[vV]}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Versione risolta: ${VERSION}"
          echo "Tag risolto: ${TAG}"

  build-windows:
    name: Build Windows (win-x64)
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Windows Packaging Script
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Version "${{ needs.meta.outputs.version }}" -Configuration "Release"

      - name: Upload Windows Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paddock-${{ needs.meta.outputs.version }}-windows-x64
          path: artifacts/Paddock-*-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (linux-x64)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ensure packaging script is executable
        run: chmod +x ./scripts/build-linux.sh

      - name: Run Linux Packaging Script
        run: |
          ./scripts/build-linux.sh "${{ needs.meta.outputs.version }}" "Release"

      - name: Upload Linux Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paddock-${{ needs.meta.outputs.version }}-linux-x64
          path: artifacts/Paddock-*-linux-x64.zip
          if-no-files-found: error

  publish-release:
    name: Pubblica Ufficialmente su GitHub Releases
    needs: [meta, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tutti i pacchetti compilati
        uses: actions/download-artifact@v4
        with:
          path: release-packages
          merge-multiple: true

      - name: Verifica pacchetti scaricati
        run: |
          ls -la release-packages/

      - name: Crea o Aggiorna GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "Paddock ${{ needs.meta.outputs.tag }} (Pre-release)"
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || startsWith(needs.meta.outputs.version, '0.') || true }}
          generate_release_notes: true
          files: |
            release-packages/*.zip
          body: |
            ## Paddock ${{ needs.meta.outputs.tag }} (Pre-release)

            Paddock è l'applicazione desktop professionale per l'ingestione, organizzazione e vendita di foto di eventi sportivi, sviluppata in **.NET 10** e **Avalonia UI**.

            ### Pacchetti Disponibili per il Download
            - **Windows (x64)**: `Paddock-${{ needs.meta.outputs.version }}-windows-x64.zip`
              *(Self-contained, non richiede l'installazione di .NET. Estrarre ed avviare `Paddock.UI.exe`)*
            - **Linux (x64)**: `Paddock-${{ needs.meta.outputs.version }}-linux-x64.zip`
              *(Self-contained per distribuzioni Linux x86_64. Estrarre ed eseguire `./Paddock.UI`)*

            ### Novità e Funzionalità della Versione 0.5.5
            - **Sistema di Aggiornamento Automatico**: Controllo manuale e silenzioso all'avvio delle release GitHub, con utility standalone `Paddock.Updater` (Avalonia) integrata per download, decompressione sicura con processo principale chiuso e riavvio automatico.
            - **Visualizzatore Foto RAW / Canon CR2**: Supporto nativo ai file `.CR2` e formati RAW fotografici in miniature griglia, visore darkroom a schermo intero (zoom continuo, panning, rotazione) e slideshow clienti su monitor secondario, con pipeline ad alte prestazioni basata su anteprime JPEG embedded ad alta definizione e fallback SkiaSharp.
            - **Rotazione Automatica Foto in Ingestione**: Nuovo flag "Ruota automaticamente" (attivo di default) nel wizard di ingestione SD per rilevamento orientamento EXIF e rotazione fisica lossless su disco delle immagini.
            - **Browser Foto a Due Tab**: Tab Atleti (con filtri Atleta e Disciplina, contatori e anteprime) e Tab Premiazioni dedicato (navigazione e anteprima completa di tutte le foto premiazioni dell'evento).
            - **Ingestione Wizard SD & Premiazioni**: Flag dedicato "Premiazioni" con disattivazione e reset automatico dei selettori atleta/disciplina e salvataggio automatico nel percorso standard `Evento/Premiazioni`.
            - **Ridenominazione File SD Standardizzata**: Generazione nomi file `[ATLETA]_[DISCIPLINA]_[TIMESTAMP]_[NUMERO].[EXT]` con normalizzazione caratteri e metadati fotocamera/scatto.
            - **Slideshow Clienti Multi-Monitor**: Supporto foto Atleti e Premiazioni, 10 transizioni grafiche con fallback resiliente, HUD Darkroom arricchito e assenza di pulsanti invasivi a tutto schermo.
            - **Desk Vendita & Catalogo Prezzi**: Listino prezzi pacchetti con modello di default, anagrafica clienti ed esportazione ordini su Excel.
            - **Watermark Live & Eliminazione Sincronizzata**: Anteprima live proporzionale a 18 MP ed eliminazione selettiva sincronizzata disco/Excel.
            - **Tab Informazioni & Versioning Allineato**: Versionamento di tutti i moduli a `0.5.5.0`, copyright © 2026 zmalrobot e link diretto a GitHub.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
