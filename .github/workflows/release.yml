name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione di rilascio (es. 0.6.0 o v0.6.0)'
        required: false
        default: '0.6.0'
        type: string
      prerelease:
        description: 'Contrassegna come pre-release'
        required: false
        default: true
        type: boolean
      draft:
        description: 'Crea come bozza (draft)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  meta:
    name: Risoluzione Versione & Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Calcola stringa versione e tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            [ -z "$RAW" ] && RAW="0.6.0"
          else
            RAW="${{ github.ref_name }}"
          fi
          VERSION="${RAW#[vV]}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Versione risolta: ${VERSION}"
          echo "Tag risolto: ${TAG}"

  build-windows:
    name: Build Windows (win-x64)
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Windows Packaging Script
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Version "${{ needs.meta.outputs.version }}" -Configuration "Release"

      - name: Upload Windows Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paddock-${{ needs.meta.outputs.version }}-windows-x64
          path: artifacts/Paddock-*-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (linux-x64)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ensure packaging script is executable
        run: chmod +x ./scripts/build-linux.sh

      - name: Run Linux Packaging Script
        run: |
          ./scripts/build-linux.sh "${{ needs.meta.outputs.version }}" "Release"

      - name: Upload Linux Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paddock-${{ needs.meta.outputs.version }}-linux-x64
          path: artifacts/Paddock-*-linux-x64.zip
          if-no-files-found: error

  publish-release:
    name: Pubblica Ufficialmente su GitHub Releases
    needs: [meta, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tutti i pacchetti compilati
        uses: actions/download-artifact@v4
        with:
          path: release-packages
          merge-multiple: true

      - name: Verifica pacchetti scaricati
        run: |
          ls -la release-packages/

      - name: Crea o Aggiorna GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "Paddock ${{ needs.meta.outputs.tag }} (Pre-release)"
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || startsWith(needs.meta.outputs.version, '0.') || true }}
          generate_release_notes: true
          files: |
            release-packages/*.zip
          body: |
            ## Paddock ${{ needs.meta.outputs.tag }} (Pre-release)

            Paddock è l'applicazione desktop professionale per l'ingestione, organizzazione e vendita di foto di eventi sportivi, sviluppata in **.NET 10** e **Avalonia UI**.

            ### Pacchetti Disponibili per il Download
            - **Windows (x64)**: `Paddock-${{ needs.meta.outputs.version }}-windows-x64.zip`
              *(Self-contained, non richiede l'installazione di .NET. Estrarre ed avviare `Paddock.UI.exe`)*
            - **Linux (x64)**: `Paddock-${{ needs.meta.outputs.version }}-linux-x64.zip`
              *(Self-contained per distribuzioni Linux x86_64. Estrarre ed eseguire `./Paddock.UI`)*

            ### Novità e Funzionalità della Versione 0.6.0
            - **Supporto Database Relazionale SQLite ("Nuovo e performante")**: Integrazione ufficiale di `Microsoft.Data.Sqlite 10.0.12` per archiviare eventi, atleti, discipline, foto, listini prezzi e acquisti all'interno di un database relazionale SQLite ottimizzato. Abilitazione nativa della modalità WAL (`journal_mode = WAL; synchronous = NORMAL;`) che elimina i blocchi di contesa sui file, velocizza gli inserimenti massivi di foto tramite singola transazione (`AddFotoBatchAsync`) e garantisce caricamenti consolidati istantanei (`GetEventDataBundleAsync`) in meno di 10ms anche su grandi cataloghi con decine di migliaia di scatti.
            - **Router Dinamico & Riconoscimento Trasparente per Estensione (`DatabaseRepositoryRouter`)**: Supporto affiancato e trasparente sia a SQLite che ad Excel. Il router rileva l'estensione del file in modo automatico (`.db`, `.sqlite`, `.sqlite3`, `.db3` per SQLite; `.xlsx`, `.xlsm`, `.xls` per Excel) e instrada tutte le operazioni al motore corrispondente senza interruzione dell'interfaccia utente.
            - **Creazione Guidata all'Avvio & Finestra Impostazioni a Doppia Scelta**: Nuova esperienza di avvio (`DatabaseStartupDialog`) con selezione esplicita per creare *"🚀 Nuovo SQLite (.db)..."* (consigliato per velocità) o *"📊 Vecchio Excel (.xlsx)..."* (compatibilità con fogli di calcolo ClosedXML), selettori file con filtri unificati, badge visivi colorati (`[SQLITE]` e `[EXCEL]`), e nuovo strumento di migrazione con 1 clic nelle Impostazioni per convertire database storici Excel in SQLite.
            - **Funzionalità Ereditate**: Conversione batch RAW/CR2 in JPEG per atleti con correzione colore stile Foto di Windows, risoluzione bug trailing slash nell'auto-updater (`Paddock.Updater`), icone multi-risoluzione incorporate negli eseguibili Windows PE, darkroom a schermo intero con filigrana e metadati per singola foto, architettura a cartella portatile (`Database/`, `Paddock/`, `Foto/`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
