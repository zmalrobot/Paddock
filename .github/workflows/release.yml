name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione di rilascio (es. 0.5.8 o v0.5.8)'
        required: false
        default: '0.5.8'
        type: string
      prerelease:
        description: 'Contrassegna come pre-release'
        required: false
        default: true
        type: boolean
      draft:
        description: 'Crea come bozza (draft)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  meta:
    name: Risoluzione Versione & Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Calcola stringa versione e tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            [ -z "$RAW" ] && RAW="0.5.8"
          else
            RAW="${{ github.ref_name }}"
          fi
          VERSION="${RAW#[vV]}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Versione risolta: ${VERSION}"
          echo "Tag risolto: ${TAG}"

  build-windows:
    name: Build Windows (win-x64)
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Windows Packaging Script
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Version "${{ needs.meta.outputs.version }}" -Configuration "Release"

      - name: Upload Windows Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paddock-${{ needs.meta.outputs.version }}-windows-x64
          path: artifacts/Paddock-*-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (linux-x64)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ensure packaging script is executable
        run: chmod +x ./scripts/build-linux.sh

      - name: Run Linux Packaging Script
        run: |
          ./scripts/build-linux.sh "${{ needs.meta.outputs.version }}" "Release"

      - name: Upload Linux Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paddock-${{ needs.meta.outputs.version }}-linux-x64
          path: artifacts/Paddock-*-linux-x64.zip
          if-no-files-found: error

  publish-release:
    name: Pubblica Ufficialmente su GitHub Releases
    needs: [meta, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tutti i pacchetti compilati
        uses: actions/download-artifact@v4
        with:
          path: release-packages
          merge-multiple: true

      - name: Verifica pacchetti scaricati
        run: |
          ls -la release-packages/

      - name: Crea o Aggiorna GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "Paddock ${{ needs.meta.outputs.tag }} (Pre-release)"
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || startsWith(needs.meta.outputs.version, '0.') || true }}
          generate_release_notes: true
          files: |
            release-packages/*.zip
          body: |
            ## Paddock ${{ needs.meta.outputs.tag }} (Pre-release)

            Paddock è l'applicazione desktop professionale per l'ingestione, organizzazione e vendita di foto di eventi sportivi, sviluppata in **.NET 10** e **Avalonia UI**.

            ### Pacchetti Disponibili per il Download
            - **Windows (x64)**: `Paddock-${{ needs.meta.outputs.version }}-windows-x64.zip`
              *(Self-contained, non richiede l'installazione di .NET. Estrarre ed avviare `Paddock.UI.exe`)*
            - **Linux (x64)**: `Paddock-${{ needs.meta.outputs.version }}-linux-x64.zip`
              *(Self-contained per distribuzioni Linux x86_64. Estrarre ed eseguire `./Paddock.UI`)*

            ### Novità e Funzionalità della Versione 0.5.8
            - **Conversione RAW/CR2 in JPEG per Atleta ("Genera Jpeg mancanti")**: Nuovo pulsante integrato nel banner collassabile di ciascun atleta all'interno del dettaglio evento. Apertura di un modale dedicato con scansione automatica di tutte le foto RAW/CR2 che non presentano il corrispettivo file JPEG con lo stesso nome base. Selezione singola/multipla/totale, opzioni configurabili per applicazione filigrana/watermark, inserimento metadati (autore e copyright) e auto-rotazione EXIF lossless. Conversione ad alta qualità con correzione colore automatica bilanciata (luminosità, contrasto e saturazione stile applicazione Foto di Windows), barra di avanzamento e stato in tempo reale, e blocco preventivo dell'azione se nessun elemento è selezionabile o in lista.
            - **Risoluzione Bug Sintassi e Percorsi nell'Auto-Updater (Paddock.Updater)**: Risolto definitivamente il problema di errore Win32 `ERROR_INVALID_NAME` causato dall'escape di trailing backslash `\"` nell'invocazione di `Paddock.Updater.exe`. Introdotta sanitizzazione automatica delle stringhe di percorso in `GitHubUpdateService`, parser con auto-ripristino per argomenti `--target` e `--version` malformati provenienti da versioni precedenti, estrazione con protezione Zip-Slip e retry resiliente dei lock sui file in esecuzione.
            - **Funzionalità Ereditate**: Risoluzione preventiva warning di compilazione (zero-warning), architettura a percorsi relativi e assoluti portatili (`Database/`, `Paddock/`, `Foto/`), applicazione filigrana e metadati su singola foto nel visore darkroom, icone multi-risoluzione incorporate negli eseguibili PE, packaging Linux multipiattaforma, rotazione automatica lossless in ingestione, browser a due tab con Premiazioni, ridenominazione metadati da SD, slideshow multi-monitor con 10 effetti e catalogo prezzi vendita.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
